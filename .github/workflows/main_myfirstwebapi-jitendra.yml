name: Build and deploy ASP.Net Core app to Azure Web App - myfirstwebapi-jitendra

"on":
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      ConnectionStrings__DefaultConnection: ${{ secrets.ConnectionStrings__DefaultConnection }}
      Jwt__Key: ${{ secrets.Jwt__Key }}
      Jwt__Issuer: ${{ secrets.Jwt__Issuer }}
      Jwt__Audience: ${{ secrets.Jwt__Audience }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore MyFirstWebApi/MyFirstWebApi.csproj

      - name: Build
        run: dotnet build MyFirstWebApi/MyFirstWebApi.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test MyFirstWebApi.Tests/MyFirstWebApi.Tests.csproj

      - name: Publish
        run: dotnet publish MyFirstWebApi/MyFirstWebApi.csproj -c Release -o ${{ env.DOTNET_ROOT }}/myapp --no-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ${{ env.DOTNET_ROOT }}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_82FAFB5C3561468590907C145F8FC0E4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BC13BAD7256C42048BBBD6ABD4A70A76 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6D7728B5578D47E289E15F12867ABE06 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'myfirstwebapi-jitendra'
          slot-name: 'Production'
          package: .
